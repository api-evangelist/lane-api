  /dms/set-trade-in-inspection-status/{order_id}:
    patch:
      tags:
      - Trade
      summary: Set Trade-in inspection status
      description: This method will set Trade-in inspection status
      operationId: set_trade_in_inspection_status_dms_set_trade_in_inspection_status__order_id__patch
      parameters:
      - required: true
        schema:
          title: Order Id
          type: integer
        name: order_id
        in: path
      - required: true
        schema:
          $ref: '#/components/schemas/TradeInInspectionStatus'
        name: inspection_status
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
components:
  schemas:
    TradeInVehicleValue:
      title: TradeInVehicleValue
      type: object
      properties:
        vehicle_id:
          title: Vehicle Id
          type: integer
          default: 0
        odometer:
          title: Odometer
          type: integer
          default: 0
        zip_code:
          title: Zip Code
          type: string
          default: ''
        vehicle_option_id:
          title: Vehicle Option Id
          type: array
          items:
            $ref: '#/components/schemas/VehicleOption'
          default: []
        start_year:
          title: Start Year
          type: integer
          default: 0
        end_year:
          title: End Year
          type: integer
          default: 0
        model_id:
          title: Model Id
          type: integer
          default: 0
    TradeInYear:
      title: TradeInYear
      type: object
      properties:
        make_id:
          title: Make Id
          type: integer
          default: 0
        make_name:
          title: Make Name
          type: string
          default: ''
        model_id:
          title: Model Id
          type: integer
          default: 0
        model_name:
          title: Model Name
          type: string
          default: ''
        platform_vehicle_type:
          $ref: '#/components/schemas/PlateformVehicleType'
    TradeInInspectionStatus:
      title: TradeInInspectionStatus
      enum:
      - Pending
      - Completed
      description: An enumeration.
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    VehicleValuationProviders:
      title: VehicleValuationProviders
      enum:
      - KBB
      - JDPower
      type: string
      description: An enumeration.
    TradeInMake:
      title: TradeInMake
      type: object
      properties:
        make_id:
          title: Make Id
          type: integer
          default: 0
        year_id:
          title: Year Id
          type: integer
          default: 0
        start_year:
          title: Start Year
          type: integer
          default: 0
        end_year:
          title: End Year
          type: integer
          default: 0
        category_id:
          title: Category Id
          type: integer
          default: 0
        platform_vehicle_type:
          $ref: '#/components/schemas/PlateformVehicleType'
    TradeInModel:
      title: TradeInModel
      type: object
      properties:
        make_id:
          title: Make Id
          type: integer
          default: 0
        year_id:
          title: Year Id
          type: integer
          default: 0
        start_year:
          title: Start Year
          type: integer
          default: 0
        end_year:
          title: End Year
          type: integer
          default: 0
        category_id:
          title: Category Id
          type: integer
          default: 0
        model_id:
          title: Model Id
          type: integer
          default: 0
        make_name:
          title: Make Name
          type: string
          default: ''
        platform_vehicle_type:
          $ref: '#/components/schemas/PlateformVehicleType'
    TradeInVehicleDetail:
      title: TradeInVehicleDetail
      type: object
      properties:
        platform_vehicle_type:
          $ref: '#/components/schemas/PlateformVehicleType'
        vehicle_id:
          title: Vehicle Id
          type: integer
          default: 0
        year_id:
          title: Year Id
          type: integer
          default: 0
        make_id:
          title: Make Id
          type: integer
          default: 0
        model_year_id:
          title: Model Year Id
          type: integer
          default: 0
        model_id:
          title: Model Id
          type: integer
          default: 0
        trim_id:
          title: Trim Id
          type: integer
          default: 0
        make_name:
          title: Make Name
          type: string
          default: ''
        model_name:
          title: Model Name
          type: string
          default: ''
    TradeInTrim:
      title: TradeInTrim
      type: object
      properties:
        trim_id:
          title: Trim Id
          type: integer
          default: 0
        year_id:
          title: Year Id
          type: integer
          default: 0
        make_id:
          title: Make Id
          type: integer
          default: 0
        model_id:
          title: Model Id
          type: integer
          default: 0
        model_year_id:
          title: Model Year Id
          type: string
          default: ''
        platform_vehicle_type:
          $ref: '#/components/schemas/PlateformVehicleType'
    VehicleOption:
      title: VehicleOption
      required:
      - vehicleOptionId
      type: object
      properties:
        vehicleOptionId:
          title: Vehicleoptionid
          type: integer
    PlateformVehicleType:
      title: PlateformVehicleType
      enum:
      - Car
      - NewCar
      - UsedCar
      - MotorBike
      type: string
      description: An enumeration.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /signup/verify-otp
externalDocs:
  url: https://developer.appexnow.com/docs/lane/overview
  description: Product Documentation
