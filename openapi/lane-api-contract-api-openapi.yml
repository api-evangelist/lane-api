openapi: 3.0.2
info:
  version: 1.3.43
  title: Lane Contract API
  contact:
    email: support@netsolapp.io, support@appexnow.com
  x-logo:
    url: ../lane/docs/64x64.png
    altText: Lane
    backgroundColor: '#FFFFFF'
  description: Lane offers a feature-rich, end-to-end order management system for asset leasing, loans and credit companies. Our platform covers all aspects, from conducting end-to-end sales to performing dealer and partner-related tasks and marketing-related activities.
servers:
- url: https://dms-api.netsolapp.io
tags:
- name: Contract
paths:
  /dms/contract-document:
    post:
      summary: Handle contract document
      description: Handle contract document
      operationId: contract_documents_dms_contract_document_post
      parameters:
      - required: true
        schema:
          title: Reference Number
          type: string
        name: reference_number
        in: query
      - required: true
        schema:
          title: Document Event
          type: string
        name: document_event
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
      tags:
      - Contract
  /dms/contract:
    get:
      tags:
      - Contract
      summary: Get active contract
      description: Get active contract
      operationId: get_active_contract_dms_contract_get
      parameters:
      - required: false
        schema:
          title: Identifier
          type: string
        name: identifier
        in: query
      - required: false
        schema:
          title: Customer Reference Id
          type: string
        name: customer_reference_id
        in: query
      - required: false
        schema:
          title: External Order Id
          type: string
        name: external_order_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Contract
      summary: Create contract
      description: Create contract
      operationId: create_contract_dms_contract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateModel'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
    patch:
      tags:
      - Contract
      summary: Update contract
      description: Update contract
      operationId: update_contract_dms_contract_patch
      parameters:
      - required: true
        schema:
          title: Identifier
          type: string
        name: identifier
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/contract/past-due-webhook:
    patch:
      tags:
      - Contract
      summary: Past due webhook
      description: Past due webhook
      operationId: past_due_webhook_dms_contract_past_due_webhook_patch
      requestBody:
        content:
          application/json:
            schema:
              title: Event
              type: object
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dms/contract/all:
    get:
      tags:
      - Contract
      summary: Get all contract records
      description: Get all contract records
      operationId: get_all_contracts_dms_contract_all_get
      parameters:
      - required: true
        schema:
          title: Page Number
          type: integer
        name: page_number
        in: query
      - required: true
        schema:
          title: Page Size
          minimum: 1
          type: integer
        name: page_size
        in: query
      - required: false
        schema:
          title: Identifier
          type: string
        name: identifier
        in: query
      - required: false
        schema:
          title: Customer Reference Id
          type: string
        name: customer_reference_id
        in: query
      - required: false
        schema:
          title: External Order Id
          type: string
        name: external_order_id
        in: query
      - description: Accepts only string values
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractStatus'
          description: Accepts only string values
        name: statuses
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPaginationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/contract-term:
    get:
      tags:
      - Contract
      summary: Get All Contract Terms
      operationId: get_all_contract_terms_dms_contract_term_get
      parameters:
      - required: true
        schema:
          title: Company Id
          type: string
        name: company_id
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/contract-allowed-annum-mileage:
    get:
      tags:
      - Contract
      summary: Get All Contract Allowed Mileages
      operationId: get_all_contract_allowed_mileages_dms_contract_allowed_annum_mileage_get
      parameters:
      - required: true
        schema:
          title: Company Id
          type: string
        name: company_id
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
components:
  schemas:
    AddressTypes:
      title: AddressTypes
      enum:
      - Mailing
      - Invoice
      - Office
      - Garaging
      - DealerAddress
      - DrivingLicense
      - Billing
      - InsuranceAddress
      - Residential
      - Employment
      type: string
      description: An enumeration.
    ContractEventModel:
      title: ContractEventModel
      type: object
      properties:
        identifier:
          title: Identifier
          type: string
        type:
          $ref: '#/components/schemas/EventStatus'
        status:
          title: Status
          type: string
    EventStatus:
      title: EventStatus
      enum:
      - Pause
      - Resume
      description: An enumeration.
    ContractCreateModel:
      title: ContractCreateModel
      required:
      - customer_reference_id
      - start_date
      - end_date
      - dealer_id
      - allowed_miles
      - exceed_miles_rate
      - terms
      - created_by
      type: object
      properties:
        external_subscription_id:
          title: External Subscription Id
          type: string
        vendor_subscription_id:
          title: Vendor Subscription Id
          type: string
        customer_reference_id:
          title: Customer Reference Id
          type: string
        external_order_id:
          title: External Order Id
          type: string
        start_date:
          title: Start Date
          type: string
          format: date-time
        end_date:
          title: End Date
          type: string
          format: date-time
        dealer_id:
          title: Dealer Id
          type: integer
        starting_odometer:
          title: Starting Odometer
          type: integer
          default: 0
        allowed_miles:
          title: Allowed Miles
          type: integer
        exceed_miles_rate:
          title: Exceed Miles Rate
          type: integer
        terms:
          title: Terms
          type: integer
        meta_data:
          title: Meta Data
          type: object
        assets:
          title: Assets
          type: array
          items:
            $ref: '#/components/schemas/ContractAssets'
        identifier:
          title: Identifier
          type: string
        created_by:
          title: Created By
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    LicenseInfoCustomerResponseModel:
      title: LicenseInfoCustomerResponseModel
      type: object
      properties:
        first_name:
          title: First Name
          type: string
        last_name:
          title: Last Name
          type: string
        status:
