        buyout_option:
          title: Buyout Option
          type: string
          description: Buyout Option
        vehicle_purchase_price:
          title: Vehicle Purchase Price
          type: integer
          description: Vehicle Purchase Price
    CustomerAddressPreResponseModel:
      title: CustomerAddressPreResponseModel
      required:
      - address_type
      type: object
      properties:
        address_line_1:
          title: Address Line 1
          type: string
