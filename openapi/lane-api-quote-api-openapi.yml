openapi: 3.0.2
info:
  version: 1.3.43
  title: Lane Quote API
  contact:
    email: support@netsolapp.io, support@appexnow.com
  x-logo:
    url: ../lane/docs/64x64.png
    altText: Lane
    backgroundColor: '#FFFFFF'
  description: Lane offers a feature-rich, end-to-end order management system for asset leasing, loans and credit companies. Our platform covers all aspects, from conducting end-to-end sales to performing dealer and partner-related tasks and marketing-related activities.
servers:
- url: https://dms-api.netsolapp.io
tags:
- name: Quote
paths:
  /dms/quote/calculation:
    post:
      tags:
      - Quote
      summary: Calculate Quotation
      description: Calculate Quotation
      operationId: calculate_order_dms_quote_calculation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramEvaluationForCalculationModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Calculate Order Dms Quote Calculation Post
                type: array
                items:
                  $ref: '#/components/schemas/OrderCalculationResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/quote/calculate-order:
    post:
      tags:
      - Quote
      summary: Calculate Quotation
      description: Calculate Quotation
      operationId: calculate_order2_dms_quote_calculate_order_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramEvaluationForCalculationModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/quote/calculate-nfa:
    post:
      tags:
      - Quote
      summary: Calculate NFA [Net Financed Amount]
      description: Calculate NFA [Net Financed Amount]
      operationId: calculate_nfa_dms_quote_calculate_nfa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFACalculationParams'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNFAResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/quote/calculation/V2:
    post:
      tags:
      - Quote
      summary: Calculate Rental
      description: Calculate Rental
      operationId: calculate_v2_dms_quote_calculation_V2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationV2Model'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/quote/create:
    post:
      tags:
      - Quote
      summary: Create Quote
      description: Create Quote
      operationId: create_quote_dms_quote_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ANQuotation'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dms/quote/calculation/multi-assets:
    post:
      tags:
      - Quote
      summary: Calculate Quotation for Multiple Assets
      description: Calculate Quotation for Multiple Assets
      operationId: calculate_order_multi_assets_dms_quote_calculation_multi_assets_post
      requestBody:
        content:
          application/json:
            schema:
              title: Asset Params
              type: array
              items:
                $ref: '#/components/schemas/ProgramEvaluationParamsModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/quote/calculation/quantity:
    post:
      tags:
      - Quote
      summary: Calculate Quotation
      description: Calculate Quotation
      operationId: calculate_order_with_quantity_dms_quote_calculation_quantity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramEvaluationParamsModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
  /dms/quote/calculation/monthlyImpact:
    post:
      tags:
      - Quote
      summary: Calculate Monthly Impact
      description: Calculate Monthly Impact
      operationId: calculate_monthly_impact_dms_quote_calculation_monthlyImpact_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationV2Model'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
components:
  schemas:
    Vehicle:
      title: Vehicle
      required:
      - vin
      - odometer_mileage
      - msrp
      type: object
      properties:
        vin:
          title: Vin
          type: string
          description: VIN
        is_new:
          title: Is New
          type: boolean
          description: Is New
        odometer_mileage:
          title: Odometer Mileage
          type: integer
          description: Odometer
        msrp:
          title: Msrp
          type: number
          description: MSRP
        year:
          title: Year
          type: integer
          description: Year
        transmission_type:
          title: Transmission Type
          type: string
          description: Transmission Type
    ANQuotationProducts:
      title: ANQuotationProducts
      required:
      - productId
      - productType
      - price
      type: object
      properties:
        productId:
          title: Productid
          type: string
          description: ID of the product
        productType:
          title: Producttype
          type: string
          description: Type of the product
        price:
          title: Price
          type: number
          description: Price of the product
    ANQuotationAddress:
      title: ANQuotationAddress
      required:
      - city
      - state
      - line1
      - line2
      - zipCode
      type: object
      properties:
        city:
          title: City
          type: string
          description: City
        state:
          title: State
          type: string
          description: State
        line1:
          title: Line1
          type: string
          description: Line 1
        line2:
          title: Line2
          type: string
          description: Line 2
        zipCode:
          title: Zipcode
          type: string
          description: Zip Code
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    TradeIn:
      title: TradeIn
      type: object
      properties:
        trade_in_type:
          title: Trade In Type
          type: string
          description: Trade In Type
        vin:
          title: Vin
          type: string
          description: VIN
        offer_amount:
          title: Offer Amount
          type: number
          description: Offer Amount
        pay_off_amount:
          title: Pay Off Amount
          type: number
          description: Pay Off Amount
        allowance_amount:
          title: Allowance Amount
          type: number
          description: Actual Cash Value
    RebateModel:
