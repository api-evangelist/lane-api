      properties:
        price:
          title: Price
          type: number
        name:
          title: Name
          type: string
        monthly_impact:
          title: Monthly Impact
          type: number
    Address:
      title: Address
      required:
      - state
      - zip_code
      type: object
      properties:
        street_address:
          title: Street Address
          type: string
          description: Street Address
        city:
          title: City
          type: string
          description: City
        state:
          title: State
          type: string
          description: State
        zip_code:
          title: Zip Code
          type: string
          description: Zip Code
    InsuranceRequestModel:
